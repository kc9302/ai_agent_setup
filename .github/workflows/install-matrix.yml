name: install-matrix
# Linux 에서만 돌리면 Windows/macOS 에서만 나는 오류(PowerShell 문법, bash 3.2, 심볼릭 링크, 홈 경로)를 놓친다.
# 세 OS 에서 설치 경로를 실제로 실행해 미리 잡는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-installer:
    name: node installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dry-run, all sources
        run: node scripts/install-skills.mjs --dry-run
      - name: dry-run in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: node scripts/install-skills.mjs --dry-run
      - name: real install of this repository's own skills into an isolated home
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-install"
          mkdir -p "$H/.claude"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          node scripts/install-skills.mjs --tag local
          for n in persona-sim-review stakeholder-rehearsal ai-setup-sync web-design-guidelines; do
            test -f "$H/.claude/skills/$n/SKILL.md" || { echo "missing: $n"; ls -la "$H/.claude/skills" || true; exit 1; }
          done
          echo "local skills installed under $H/.claude/skills"
      - name: real install of one wildcard source (checks argument quoting on this OS)
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-wild"
          mkdir -p "$H/.claude"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          node scripts/install-skills.mjs --tag writing
          test -d "$H/.claude/skills/humanizer" || { echo "missing: humanizer"; ls -la "$H/.claude/skills" || true; exit 1; }

      - name: "--diff warns about a pre-existing skill with the same name and changes nothing"
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-diff"
          mkdir -p "$H/.claude/skills/docx"
          printf -- '---\nname: docx\ndescription: mine\n---\nmine\n' > "$H/.claude/skills/docx/SKILL.md"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          out="$(node scripts/install-skills.mjs --profile minimal --diff 2>&1)"
          echo "$out" | tail -14
          echo "$out" | grep -q '출처 불명의 같은 이름.*: 1개' || { echo "expected exactly one overwrite warning (docx)"; exit 1; }
          echo "$out" | grep -q '아무것도 설치하지 않았습니다' || { echo "--diff must say it installed nothing"; exit 1; }
          grep -q '^mine$' "$H/.claude/skills/docx/SKILL.md" || { echo "--diff modified an existing skill"; exit 1; }
      - name: "--backup copies a hand-made skill before it is overwritten"
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-backup"
          mkdir -p "$H/.claude/skills/skill-radar"
          printf -- '---\nname: skill-radar\ndescription: mine\n---\nHAND-MADE-MARKER\n' > "$H/.claude/skills/skill-radar/SKILL.md"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          node scripts/install-skills.mjs --backup --tag local
          B="$(ls -d "$H"/.agents/skills-backup/*/skill-radar 2>/dev/null | head -1)"
          test -n "$B" || { echo "no backup was made"; find "$H/.agents" -maxdepth 3 | head -30; exit 1; }
          grep -q 'HAND-MADE-MARKER' "$B/SKILL.md" || { echo "backup does not hold the original content"; exit 1; }
          if grep -rq 'HAND-MADE-MARKER' "$H/.agents/skills/skill-radar/SKILL.md"; then echo "the skill was not overwritten by the install"; exit 1; fi
          # 같은 내용으로 다시 설치할 때는 백업할 것이 없어야 한다
          out="$(node scripts/install-skills.mjs --backup-only --tag local 2>&1)"
          echo "$out" | tail -3
          echo "$out" | grep -q '백업할 기존 스킬이 없습니다' || { echo "re-running with unchanged local skills must not back up again"; exit 1; }
      - name: "--profile minimal installs the core sources only (no local skills)"
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-min"
          mkdir -p "$H/.claude"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          node scripts/install-skills.mjs --profile minimal
          test -d "$H/.claude/skills/karpathy-guidelines" || { echo "missing: karpathy-guidelines (core source)"; ls -la "$H/.claude/skills" || true; exit 1; }
          if [ -d "$H/.claude/skills/skill-radar" ]; then echo "minimal must not install this repository's local skills"; exit 1; fi

      - name: "skills stay LF even when git's autocrlf is on (the Windows default)"
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-eol"
          mkdir -p "$H/.claude"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          printf '[core]\n\tautocrlf = true\n' > "$RUNNER_TEMP/gitconfig-autocrlf"
          export GIT_CONFIG_GLOBAL="$(cygpath -w "$RUNNER_TEMP/gitconfig-autocrlf" 2>/dev/null || echo "$RUNNER_TEMP/gitconfig-autocrlf")"
          node scripts/install-skills.mjs --tag behavior
          f="$H/.agents/skills/karpathy-guidelines/SKILL.md"
          test -f "$f" || { echo "missing: $f"; exit 1; }
          if grep -q $'\r' "$f"; then echo "CRLF found in an installed skill although the installer forces core.autocrlf=false"; exit 1; fi
          echo "LF only"

  bootstrap-dry-run:
    name: bootstrap.sh dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bash dry-run (macOS uses /bin/bash 3.2 on purpose)
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then /bin/bash --version | head -1; /bin/bash bootstrap.sh --dry-run; else bash bootstrap.sh --dry-run; fi
      - name: bash syntax check of every script (same bash)
        shell: bash
        run: |
          B=bash; [ "$(uname -s)" = "Darwin" ] && B=/bin/bash
          for f in bootstrap.sh scripts/*.sh; do $B -n "$f" || { echo "syntax error: $f"; exit 1; }; done

  node-too-old:
    name: old Node is stopped with a clear message (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node installer must refuse before installing anything
        shell: bash
        run: |
          set +e
          out="$(node scripts/install-skills.mjs 2>&1)"; rc=$?
          echo "$out" | head -5
          [ "$rc" = 2 ] || { echo "expected exit 2, got $rc"; exit 1; }
          echo "$out" | grep -q "22.20" || { echo "message must mention 22.20"; exit 1; }
      - name: bootstrap.sh must refuse too
        shell: bash
        run: |
          set +e
          out="$(bash bootstrap.sh --skills-only 2>&1)"; rc=$?
          echo "$out" | tail -3
          [ "$rc" != 0 ] || { echo "expected failure on Node 20"; exit 1; }
          echo "$out" | grep -q "22.20" || { echo "message must mention 22.20"; exit 1; }

  bootstrap-full-macos:
    # 실제 맥북과 같은 흐름(스킬 + 도구 전체)을 빈 HOME 에서 끝까지 돌린다. 도구 21개를 설치하므로 오래 걸린다.
    name: bootstrap.sh full run (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: full bootstrap in an isolated home (/bin/bash 3.2)
        run: |
          H="$RUNNER_TEMP/h-full"
          mkdir -p "$H/.claude"
          export HOME="$H"
          /bin/bash bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/bootstrap.log"
          exit "${PIPESTATUS[0]}"
      - name: every defined skill is installed
        run: |
          export HOME="$RUNNER_TEMP/h-full"
          /bin/bash scripts/verify.sh
      - name: tool status report (every tool must be at its pinned version)
        run: |
          export HOME="$RUNNER_TEMP/h-full"
          out="$(/bin/bash scripts/status.sh)"
          printf '%s\n' "$out"
          # status 의 check 는 이제 '있다'가 아니라 '고정한 버전이다'를 확인한다. 러너에는 claude CLI 가 없어 MCP 등록 3개가, Node 22 라서 paperclipai 가 빠지는 것만 허용한다.
          bad="$(printf '%s\n' "$out" | grep '✗' | grep -vE 'leann-mcp|context7-mcp|playwright-mcp|paperclipai' || true)"
          [ -z "$bad" ] || { echo "도구가 고정 버전과 다릅니다:"; echo "$bad"; exit 1; }
      - name: second tools run is idempotent
        run: |
          export HOME="$RUNNER_TEMP/h-full"
          /bin/bash bootstrap.sh --tools-only

  snapshot:
    # 세 OS 에서 같은 설치기로 스킬 전체를 깔고, 설치 기록(skills CLI 의 잠금 파일: 출처·고정 커밋·폴더 내용 해시)을 남긴다.
    name: snapshot of installed skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install every skill into an isolated home, then record what was installed
        shell: bash
        run: |
          H="$RUNNER_TEMP/h-snap"
          mkdir -p "$H/.claude"
          export HOME="$H"
          export USERPROFILE="$(cygpath -w "$H" 2>/dev/null || echo "$H")"
          node scripts/install-skills.mjs
          node scripts/snapshot.mjs --skills-only > "$RUNNER_TEMP/snap-${{ runner.os }}.json"
          node -e 'const s=require(process.argv[1]).skills;console.log("recorded",Object.keys(s).length,"skills")' "$RUNNER_TEMP/snap-${{ runner.os }}.json"
          # 두 스냅샷을 서로만 비교하면 "둘 다 똑같이 빠뜨린 것"을 못 잡는다. 이 OS 의 스냅샷을 manifest 와 직접 맞춰 본다.
          node scripts/snapshot.mjs --check "$RUNNER_TEMP/snap-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ runner.os }}
          path: ${{ runner.temp }}/snap-${{ runner.os }}.json

  same-everywhere:
    # 위 세 스냅샷을 비교한다. "세 OS 에 같은 스킬이 같은 내용으로 설치됐다"를 매 실행마다 기록으로 확인한다.
    name: the three installs are identical
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          path: snaps
          merge-multiple: true
      - name: Linux vs macOS
        run: node scripts/snapshot.mjs --diff snaps/snap-Linux.json snaps/snap-macOS.json
      - name: Linux vs Windows
        if: always()   # 앞 비교가 실패해도 이 비교 결과는 봐야 한다
        run: node scripts/snapshot.mjs --diff snaps/snap-Linux.json snaps/snap-Windows.json
