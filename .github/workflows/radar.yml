name: radar
# 새로 뜨거나 인기 있는 Agent Skills 저장소를 찾아 candidates.json 으로 발행한다. 후보를 "보여주기만" 하고 설치나 매니페스트 수정은 하지 않는다.
# 매일 한 번(schedule) 돌고, 수동 실행(workflow_dispatch)도 된다. PR 에서는 수집만 해서 결과를 아티팩트로 남기고 발행하지 않는다.
# 발행 위치: 이 저장소의 radar-data 브랜치 (커밋 1개를 매번 덮어쓴다). 읽는 주소:
#   https://raw.githubusercontent.com/<owner>/<repo>/radar-data/candidates.json
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/radar.sh
      - scripts/test-radar.sh
      - .github/workflows/radar.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/radar.sh --out "$RUNNER_TEMP/candidates.json"
      - name: sanity check (empty result usually means the API call failed)
        run: |
          jq -e '(.new|length) + (.popular|length) > 0' "$RUNNER_TEMP/candidates.json" >/dev/null || { echo "no candidates found"; exit 1; }
          jq -r '"new=\(.new|length) popular=\(.popular|length)"' "$RUNNER_TEMP/candidates.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: ${{ runner.temp }}/candidates.json

  publish:
    needs: collect
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidates
          path: ${{ runner.temp }}/out
      - name: publish to radar-data (single commit, overwritten each run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan radar-data
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/out/candidates.json" candidates.json
          git add candidates.json
          git commit -qm "radar: $(date -u +%Y-%m-%d)"
          git push --force origin radar-data
